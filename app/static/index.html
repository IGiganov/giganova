<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigaNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <header>
      <div class="brand">
        <h1>Giga<span class="spark">Nova</span></h1>
        <p class="tagline">AI market desk</p>
      </div>
      <div class="header-right">
        <span class="live"><span class="dot"></span>Live</span>
        <div id="usage" class="usage"></div>
      </div>
    </header>

    <div id="ticker" class="ticker-bar"></div>

    <main id="chat"></main>

    <form id="form" class="composer">
      <textarea id="input" rows="2" placeholder="Ask about a ticker, e.g. What moved NVDA this week?"></textarea>
      <button type="submit" id="send">Ask</button>
    </form>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
