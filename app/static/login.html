<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · GigaNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body>
  <div class="layout layout-login">
    <header class="login-header">
      <div class="brand">
        <h1>Giga<span class="spark">Nova</span></h1>
        <p class="tagline">AI market desk</p>
      </div>
    </header>

    <div class="login-panel">
      <h2 class="login-title">Sign in</h2>
      <p class="login-subtitle">Internal access only</p>

      <form id="login-form" class="login-form">
        <label class="login-field">
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>
        <label class="login-field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error" hidden></p>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
    </div>
  </div>
  <script src="/static/login.js?v=1"></script>
</body>
</html>
